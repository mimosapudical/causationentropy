name: Path B budget-matched baselines

on:
  push:
    branches:
      - experiment/path-b-benchmark-v2
    paths:
      - "experiments/path_b_budget_matched_baselines.py"
      - ".github/workflows/path-b-budget-baselines.yml"
  workflow_dispatch:

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          mkdir -p experiments/results/path_b_budget_baselines
      - name: Run budget-matched screens
        run: |
          python -m experiments.path_b_budget_matched_baselines             --nodes 20 50             --seeds 5             --T 300             --retention 0.40             --n-shuffles 20             > experiments/results/path_b_budget_baselines/results.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-budget-baseline-results
          path: experiments/results/path_b_budget_baselines
          if-no-files-found: warn
