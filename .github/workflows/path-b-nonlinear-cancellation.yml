name: Path B nonlinear cancellation baselines

on:
  push:
    branches:
      - experiment/path-b-benchmark-v2
    paths:
      - "experiments/path_b_nonlinear_cancellation_baselines.py"
      - ".github/workflows/path-b-nonlinear-cancellation.yml"
  workflow_dispatch:

jobs:
  nonlinear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          mkdir -p experiments/results/path_b_nonlinear_cancellation
      - name: Run
        run: |
          python -m experiments.path_b_nonlinear_cancellation_baselines             --n-nodes 20             --T 300             --a 1.0             --sigma-u 1.0             --noise-scale 0.2             --retentions 0.10 0.20 0.40             --seeds 20             > experiments/results/path_b_nonlinear_cancellation/results.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-nonlinear-cancellation-results
          path: experiments/results/path_b_nonlinear_cancellation
          if-no-files-found: warn
