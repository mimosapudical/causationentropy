name: Path B Gaussian replication

on:
  push:
    branches:
      - experiment/path-b-benchmark-v2
    paths:
      - ".github/workflows/path-b-gaussian-replication.yml"
  workflow_dispatch:

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          mkdir -p experiments/results/path_b_gaussian_replication

      - name: Five-seed primary Gaussian
        run: |
          for seed in 0 1 2 3 4; do
            python -m experiments.path_b_benchmark_v2 \
              --case gaussian \
              --seed "$seed" \
              --retention 0.40 \
              --n-shuffles 50 \
              > "experiments/results/path_b_gaussian_replication/primary_seed_${seed}.json"
          done

      - name: Scaling N20 N50 N100
        run: |
          for n in 20 50 100; do
            if [ "$n" -lt 60 ]; then T=300; else T=500; fi
            for seed in 0 1 2; do
              python -m experiments.path_b_benchmark_v2 \
                --case gaussian \
                --seed "$seed" \
                --retention 0.40 \
                --n-shuffles 20 \
                --n-nodes "$n" \
                --T "$T" \
                > "experiments/results/path_b_gaussian_replication/scale_n${n}_seed_${seed}.json"
            done
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-gaussian-replication-results
          path: experiments/results/path_b_gaussian_replication
          if-no-files-found: warn
