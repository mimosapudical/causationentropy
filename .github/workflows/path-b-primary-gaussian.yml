name: Path B primary Gaussian only

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/path-b-benchmark-v2
    paths:
      - ".github/workflows/path-b-primary-gaussian.yml"

jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          mkdir -p experiments/results/path_b_primary_gaussian
      - name: Run five seeds
        run: |
          for seed in 0 1 2 3 4; do
            python -m experiments.path_b_benchmark_v2 \
              --case gaussian --seed "$seed" \
              --retention 0.40 --n-shuffles 50 \
              > "experiments/results/path_b_primary_gaussian/seed_${seed}.json"
          done
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: path-b-primary-gaussian-results
          path: experiments/results/path_b_primary_gaussian
