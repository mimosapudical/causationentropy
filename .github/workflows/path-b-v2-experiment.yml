name: Path B v2 experiment validation

on:
  push:
    branches:
      - experiment/path-b-benchmark-v2
  workflow_dispatch:

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Quick Path B v2 validation
        run: |
          python -m experiments.run_path_b_v2 --mode quick --outdir experiments/results/path_b_v2_ci

      - name: Beta-min parent-sure screening audit
        run: |
          python -m experiments.path_b_beta_min_audit \
            --nodes 20 50 \
            --sample-sizes 150 300 \
            --weight-floors 0.0 0.25 0.5 \
            --seeds 1 \
            --retention 0.40 \
            > experiments/results/path_b_v2_ci/04g_beta_min_screening.json

      - name: True-edge detectability audit
        run: |
          python -m experiments.path_b_true_edge_detectability_audit \
            experiments/results/path_b_v2_ci/04b_path_preservation.json \
            > experiments/results/path_b_v2_ci/04f_true_edge_detectability.json

      - name: Certified Path B working-set audit
        run: |
          python -m experiments.path_b_certified_working_set_audit \
            --nodes 20 50 \
            --seeds 1 \
            --retention 0.40 \
            --n-shuffles 10 \
            > experiments/results/path_b_v2_ci/04c_certified_working_set.json

      - name: Block CMI screen-certificate audit
        run: |
          python -m experiments.path_b_block_certificate_audit \
            --nodes 20 50 \
            --seeds 1 \
            --retention 0.40 \
            --alpha 0.05 \
            > experiments/results/path_b_v2_ci/04d_block_certificate.json

      - name: Partitioned low-dimensional certificate audit
        run: |
          python -m experiments.path_b_partition_certificate_audit \
            --nodes 20 50 \
            --seeds 1 \
            --retention 0.40 \
            --alpha 0.05 \
            --n-shuffles 10 \
            > experiments/results/path_b_v2_ci/04e_partition_certificate.json

      - name: Beta-min phase-transition audit
        run: |
          python -m experiments.path_b_beta_min_phase_transition \
            --n-nodes 20 \
            --T-values 150 300 600 \
            --beta-values 0.02 0.04 0.08 0.16 \
            --seeds 2 \
            --edge-probability 0.10 \
            --retention 0.40 \
            --n-shuffles 10 \
            > experiments/results/path_b_v2_ci/04g_beta_min_phase_transition.json

      - name: Controlled suppression-rescue audit
        run: |
          python -m experiments.path_b_suppression_phase_transition \
            --n-nodes 20 \
            --T 300 \
            --beta 0.20 \
            --rho 0.80 \
            --deltas 0.0 0.05 0.10 0.25 0.50 1.0 \
            --retention 0.40 \
            --seeds 20 \
            > experiments/results/path_b_v2_ci/04h_suppression_phase_transition.json

      - name: Upload experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-v2-ci-results
          path: experiments/results/path_b_v2_ci
          if-no-files-found: warn
